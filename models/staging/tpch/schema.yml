version: 2

models:
  - name: stg_tpch_orders
    description: "Staging table for TPCH Orders data. Contains order-level transactional details sourced from TPCH dataset."
    columns:
      - name: order_key
        description: "Unique identifier for each order. Primary key in the orders table."
      - name: customer_key
        description: "Foreign key reference to the customer who placed the order."
      - name: status_code
        description: "Order status code (e.g., 'O' = Open, 'F' = Filled, 'P' = Pending)."
      - name: total_price
        description: "Total order price (sum of line items)."
      - name: order_date
        description: "Date when the order was created."
      - name: priority_code
        description: "Order priority level (e.g., 1-URGENT, 2-HIGH, 3-NORMAL)."
      - name: clerk_name
        description: "Name/code of the clerk who processed the order."
      - name: ship_priority
        description: "Numeric value representing shipping priority."
      - name: comment
        description: "Free-text field with additional comments about the order."
